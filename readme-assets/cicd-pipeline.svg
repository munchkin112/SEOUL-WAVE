<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
  <title id="title">SEOUL WAVE CI/CD 파이프라인</title>
  <desc id="desc">문서 전용 변경은 계약 테스트와 필수 게이트를 통과하고 이미지 게시와 배포를 생략한다. 코드 변경은 전체 검증 후 성공한 dev push에서만 ECR에 게시한다. 별도 배포 워크플로는 출처와 산출물을 검증하고 허용 시간에만 OIDC와 SSM으로 EC2에 배포한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#8582b6"/></marker>
    <style>
      text{font-family:'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;fill:#1a2444}
      .title{font-size:30px;font-weight:700}.sub{font-size:20px;fill:#5d6683}
      .label{font-size:18px;font-weight:700;fill:#5448d8}.head{font-size:23px;font-weight:700}
      .body{font-size:19px;fill:#505d7b}.note{font-size:18px;fill:#505d7b}
      .box{fill:#fff;stroke:#d3d4f3;stroke-width:2;rx:15}
      .link{stroke:#8582b6;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="730" rx="20" fill="#f6f7ff"/>
  <text x="42" y="52" class="title">변경 유형에 맞춘 검증 · 테스트한 이미지 그대로 배포</text>
  <text x="42" y="88" class="sub">dev/main push · PR → 변경 파일 판별 / 문서와 코드가 섞이면 서비스 변경으로 처리</text>

  <rect x="24" y="112" width="1392" height="141" rx="18" fill="#eeebff"/>
  <text x="42" y="143" class="label">CI · 문서 전용</text>
  <rect x="42" y="158" width="280" height="76" class="box"/>
  <text x="182" y="190" text-anchor="middle" class="head">README · docs · 문서 자산</text>
  <text x="182" y="217" text-anchor="middle" class="body">운영 코드·설정 변경 없음</text>
  <path d="M322 196H370" class="link"/>
  <rect x="380" y="158" width="270" height="76" class="box"/>
  <text x="515" y="190" text-anchor="middle" class="head">contracts</text>
  <text x="515" y="217" text-anchor="middle" class="body">가벼운 계약 테스트</text>
  <path d="M650 196H698" class="link"/>
  <rect x="708" y="158" width="270" height="76" class="box"/>
  <text x="843" y="190" text-anchor="middle" class="head">pipeline-gate 성공</text>
  <text x="843" y="217" text-anchor="middle" class="body">필수 검사 결과 유지</text>
  <path d="M978 196H1026" class="link"/>
  <rect x="1036" y="158" width="360" height="76" rx="15" fill="#e5f5ef" stroke="#8cc9b0" stroke-width="2"/>
  <text x="1216" y="190" text-anchor="middle" class="head">Docker · ECR · EC2 생략</text>
  <text x="1216" y="217" text-anchor="middle" class="body">run별 변경 판정 산출물 보관</text>

  <rect x="24" y="272" width="1392" height="141" rx="18" fill="#edf2ff"/>
  <text x="42" y="303" class="label">CI · 서비스 변경</text>
  <rect x="42" y="318" width="280" height="76" class="box"/>
  <text x="182" y="350" text-anchor="middle" class="head">앱 · Docker · CI · 배포 설정</text>
  <text x="182" y="377" text-anchor="middle" class="body">contracts도 반드시 통과</text>
  <path d="M322 356H370" class="link"/>
  <rect x="380" y="318" width="270" height="76" class="box"/>
  <text x="515" y="350" text-anchor="middle" class="head">Backend ∥ Frontend</text>
  <text x="515" y="377" text-anchor="middle" class="body">빌드 · 테스트 · 커버리지</text>
  <path d="M650 356H698" class="link"/>
  <rect x="708" y="318" width="270" height="76" class="box"/>
  <text x="843" y="350" text-anchor="middle" class="head">Integration → Gate</text>
  <text x="843" y="377" text-anchor="middle" class="body">동일 이미지로 통합 검사</text>
  <path d="M978 356H1026" class="link"/>
  <rect x="1036" y="318" width="360" height="76" class="box"/>
  <text x="1216" y="350" text-anchor="middle" class="head">ECR + verified-release</text>
  <text x="1216" y="377" text-anchor="middle" class="body">성공한 dev push만 게시</text>

  <text x="42" y="456" class="label">CD · 별도 workflow_run / 성공한 dev push 완료를 수신</text>
  <rect x="42" y="480" width="280" height="108" class="box"/>
  <text x="182" y="517" text-anchor="middle" class="head">출처 · SHA · Artifact</text>
  <text x="182" y="549" text-anchor="middle" class="body">run · digest · 최신 HEAD 대조</text>
  <text x="182" y="574" text-anchor="middle" class="body">코드 릴리스 누락은 실패</text>
  <path d="M322 534H370" class="link"/>
  <rect x="380" y="480" width="270" height="108" rx="15" fill="#fff6e5" stroke="#e1bd74" stroke-width="2"/>
  <text x="515" y="517" text-anchor="middle" class="head">배포 접수 시간 확인</text>
  <text x="515" y="549" text-anchor="middle" class="body">09:00~17:59 KST</text>
  <text x="515" y="574" text-anchor="middle" class="body">시간 밖 정상 릴리스는 보류</text>
  <path d="M650 534H698" class="link"/>
  <rect x="708" y="480" width="270" height="108" class="box"/>
  <text x="843" y="517" text-anchor="middle" class="head">OIDC → 고정 SSM 문서</text>
  <text x="843" y="549" text-anchor="middle" class="body">정해진 IAM · 문서 · EC2</text>
  <text x="843" y="574" text-anchor="middle" class="body">digest로 고정한 이미지</text>
  <path d="M978 534H1026" class="link"/>
  <rect x="1036" y="480" width="360" height="108" class="box"/>
  <text x="1216" y="517" text-anchor="middle" class="head">EC2 적용 · 배포 후 검사</text>
  <text x="1216" y="549" text-anchor="middle" class="body">이미지 · Health · 인증 · 시간표</text>
  <text x="1216" y="574" text-anchor="middle" class="body">검사 실패 시 이전 이미지 복구 시도</text>

  <rect x="42" y="620" width="1354" height="78" rx="14" fill="#fff" stroke="#d3d4f3"/>
  <text x="64" y="650" class="note">필수 검사 실패 → 게시·배포 차단  /  문서 전용 배포는 정상 생략  /  결과와 실패 사유는 Discord·Artifact에 기록</text>
  <text x="64" y="679" class="note">시간 밖 보류는 자동 예약이 아닙니다. 허용 시간에 workflow를 재실행하면 릴리스와 최신 dev HEAD를 다시 검증합니다.</text>
</svg>
