<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">SEOUL WAVE service architecture</title><desc id="desc">User, frontend, backend, itinerary worker with four LangGraph nodes, data and external services.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/></marker><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#183447}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#54717f}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#456270}.box{rx:18;stroke-width:2}.line{stroke:#607d8b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style></defs>
<rect width="1440" height="820" fill="#f6fafb"/><text x="56" y="60" class="title">SEOUL WAVE · 서비스 아키텍처</text><text x="56" y="92" class="sub">검증된 입력과 후보를 LangGraph가 순차 전달하고, 코드 검증을 통과한 결과만 저장합니다.</text>
<rect x="55" y="145" width="200" height="105" class="box" fill="#e7f3f5" stroke="#69a9b5"/><text x="155" y="185" class="head" text-anchor="middle">방문자</text><text x="155" y="216" class="body" text-anchor="middle">날짜 · 선착장 · 선호 입력</text>
<rect x="330" y="145" width="225" height="105" class="box" fill="#e7f3f5" stroke="#69a9b5"/><text x="442" y="185" class="head" text-anchor="middle">Frontend</text><text x="442" y="216" class="body" text-anchor="middle">입력 · 진행 · 결과 표시</text>
<rect x="630" y="145" width="235" height="105" class="box" fill="#eaf0fa" stroke="#829bcc"/><text x="747" y="185" class="head" text-anchor="middle">Backend API</text><text x="747" y="216" class="body" text-anchor="middle">검증 · 실행 ID · 작업 등록</text>
<rect x="955" y="120" width="430" height="455" class="box" fill="#fff" stroke="#95aab3"/><text x="1170" y="157" class="head" text-anchor="middle">itinerary-worker · LangGraph</text><text x="1170" y="184" class="small" text-anchor="middle">한 워커 안에서 순차 실행 · 타입 지정 공유 상태</text>
<rect x="995" y="212" width="350" height="62" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="1170" y="250" class="body" text-anchor="middle">1 · trip_mobility_agent · 이동 검토</text>
<rect x="995" y="300" width="350" height="62" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="1170" y="338" class="body" text-anchor="middle">2 · event_explanation_agent · 추천 설명</text>
<rect x="995" y="388" width="350" height="62" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="1170" y="426" class="body" text-anchor="middle">3 · schedule_critic_agent · PASS / REVISE / REJECT</text>
<rect x="995" y="482" width="350" height="62" class="box" fill="#e7f5ed" stroke="#70ad88"/><text x="1170" y="520" class="body" text-anchor="middle">4 · result_validator · ID · 근거 · 개수 검증</text>
<path d="M255 198 H330" class="line"/><path d="M555 198 H630" class="line"/><path d="M865 198 H950" class="line"/>
<path d="M1170 274 V297" class="line"/><path d="M1170 362 V385" class="line"/><path d="M1170 450 V479" class="line"/><path d="M1005 419 C930 419 930 330 1005 330" class="line dash"/><text x="935" y="386" class="small" text-anchor="middle">수정 1회</text>
<rect x="55" y="340" width="420" height="190" class="box" fill="#fff8e6" stroke="#d6b46a"/><text x="265" y="378" class="head" text-anchor="middle">입력 후보 생성</text><text x="90" y="416" class="body">• 시간표에서 출발 편·예상 도착 계산</text><text x="90" y="450" class="body">• 서울시 문화행사 API 조회</text><text x="90" y="484" class="body">• 행사 없으면 장소 카탈로그 조회</text><text x="90" y="512" class="small">후보가 없으면 추천 그래프를 실행하지 않음</text>
<rect x="540" y="340" width="320" height="190" class="box" fill="#e9f5ef" stroke="#70ad88"/><text x="700" y="378" class="head" text-anchor="middle">PostgreSQL 18</text><text x="700" y="416" class="body" text-anchor="middle">장소 · 코스 · 운영 로그</text><text x="700" y="450" class="body" text-anchor="middle">run · step · API · handoff</text><text x="700" y="484" class="body" text-anchor="middle">incident · recovery</text><path d="M475 430 H535" class="line"/><path d="M860 430 C910 430 925 525 995 525" class="line"/>
<rect x="55" y="615" width="420" height="135" class="box" fill="#fff" stroke="#95aab3"/><text x="265" y="651" class="head" text-anchor="middle">DB 감시 컨테이너</text><text x="265" y="683" class="body" text-anchor="middle">10초 probe · 연속 2회 실패 감지</text><text x="265" y="715" class="body" text-anchor="middle">SQLite spool → DB 복구 후 로그 반영</text><path d="M475 680 C605 680 600 535 650 530" class="line dash"/>
<rect x="540" y="615" width="320" height="135" class="box" fill="#fff" stroke="#95aab3"/><text x="700" y="651" class="head" text-anchor="middle">외부 서비스</text><text x="700" y="683" class="body" text-anchor="middle">서울시 문화행사 API · OpenAI API</text><text x="700" y="715" class="small" text-anchor="middle">LLM은 SQL·셸·Docker를 직접 호출하지 않음</text><path d="M860 680 C1020 680 1040 580 1080 550" class="line dash"/>
<rect x="955" y="625" width="430" height="120" class="box" fill="#e9f5ef" stroke="#70ad88"/><text x="1170" y="665" class="head" text-anchor="middle">저장·응답</text><text x="1170" y="698" class="body" text-anchor="middle">승인 + 결정적 검증 통과 결과만 코스로 저장</text><text x="1170" y="727" class="small" text-anchor="middle">같은 방문 ID의 유효한 쿠키로 기록 조회</text><path d="M1170 545 V620" class="line"/>
</svg>

