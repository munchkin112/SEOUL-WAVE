<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">SEOUL WAVE recovery and CI pipeline</title><desc id="desc">Four automated recovery types and CI image identity validation from test to deployment.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/></marker><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#183447}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#456270}.box{rx:16;stroke-width:2}.line{stroke:#607d8b;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style></defs><rect width="1440" height="720" fill="#f6fafb"/><text x="50" y="55" class="title">자동 복구와 이미지 검증 파이프라인</text>
<text x="55" y="112" class="head">장애별 자동 복구</text>
<rect x="55" y="145" width="300" height="170" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="205" y="183" class="head" text-anchor="middle">FT-01 · LLM 일시 오류</text><text x="80" y="225" class="body">같은 Agent 단계에서 재호출</text><text x="80" y="258" class="body">추가 최대 2회 · LLM 총 8회 상한</text><text x="80" y="290" class="small">최신 시험: 추천 SUCCESS</text>
<rect x="390" y="145" width="300" height="170" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="540" y="183" class="head" text-anchor="middle">FT-02 · Graph 오류</text><text x="415" y="225" class="body">동일 run_id 작업 재등록</text><text x="415" y="258" class="body">최초 포함 3회 · 대기 2→4→8초</text><text x="415" y="290" class="small">최신 시험: 결과 1건 저장</text>
<rect x="725" y="145" width="300" height="170" class="box" fill="#e7f5ed" stroke="#70ad88"/><text x="875" y="183" class="head" text-anchor="middle">FT-03 · DB 프로세스</text><text x="750" y="225" class="body">Docker Compose 재시작 정책</text><text x="750" y="258" class="body">DB 정상화 후 조회·추천 확인</text><text x="750" y="290" class="small">짧은 장애라 incident 미생성</text>
<rect x="1060" y="145" width="325" height="170" class="box" fill="#fff8e6" stroke="#d6b46a"/><text x="1222" y="183" class="head" text-anchor="middle">FT-04 · 구조화 출력</text><text x="1085" y="225" class="body">형식 수정 요청 1회</text><text x="1085" y="258" class="body">재검증 실패 시 안전 종료</text><text x="1085" y="290" class="small">최신 시험: 추천 SUCCESS</text>
<text x="55" y="380" class="head">CI/CD · 테스트한 이미지의 동일성 보장</text>
<rect x="55" y="420" width="230" height="130" class="box" fill="#e7f3f5" stroke="#69a9b5"/><text x="170" y="465" class="head" text-anchor="middle">운영 기반 이미지</text><text x="170" y="505" class="body" text-anchor="middle">런타임 의존성 고정</text>
<rect x="335" y="420" width="230" height="130" class="box" fill="#e7f3f5" stroke="#69a9b5"/><text x="450" y="465" class="head" text-anchor="middle">테스트 jobs</text><text x="450" y="505" class="body" text-anchor="middle">이미지 아카이브 보관</text>
<rect x="615" y="420" width="230" height="130" class="box" fill="#eaf0fa" stroke="#829bcc"/><text x="730" y="465" class="head" text-anchor="middle">통합 job</text><text x="730" y="505" class="body" text-anchor="middle">아카이브 이미지 실행</text>
<rect x="895" y="420" width="230" height="130" class="box" fill="#eaf0fa" stroke="#829bcc"/><text x="1010" y="465" class="head" text-anchor="middle">검증·게시</text><text x="1010" y="505" class="body" text-anchor="middle">SHA-256 / manifest 대조</text>
<rect x="1175" y="420" width="210" height="130" class="box" fill="#e7f5ed" stroke="#70ad88"/><text x="1280" y="465" class="head" text-anchor="middle">배포</text><text x="1280" y="505" class="body" text-anchor="middle">digest 고정 · AWS SSM</text>
<path d="M285 485 H330" class="line"/><path d="M565 485 H610" class="line"/><path d="M845 485 H890" class="line"/><path d="M1125 485 H1170" class="line"/>
<rect x="335" y="600" width="790" height="65" class="box" fill="#fff" stroke="#d99c9c"/><text x="730" y="640" class="body" text-anchor="middle">Backend · Frontend · Integration 중 하나라도 실패하면 gate가 publish와 배포를 차단합니다.</text>
</svg>

