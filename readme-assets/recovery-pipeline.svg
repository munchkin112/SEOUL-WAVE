<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="345" viewBox="0 0 1440 345" role="img" aria-labelledby="title desc">
<title id="title">SEOUL WAVE 장애 감지와 자동복구</title><desc id="desc">Four automated recovery types for LLM calls, graph execution, database processes and structured outputs.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/></marker><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#183447}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#456270}.box{rx:16;stroke-width:2}.line{stroke:#607d8b;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style></defs><rect width="1440" height="345" fill="#f6fafb"/><text x="50" y="55" class="title">장애 감지와 자동복구</text>
<text x="55" y="112" class="head">장애별 자동 복구</text>
<rect x="55" y="145" width="300" height="170" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="205" y="183" class="head" text-anchor="middle">FT-01 · LLM 일시 오류</text><text x="80" y="225" class="body">같은 Agent 단계에서 재호출</text><text x="80" y="258" class="body">추가 최대 2회 · LLM 총 8회 상한</text><text x="80" y="290" class="small">최신 시험: 추천 SUCCESS</text>
<rect x="390" y="145" width="300" height="170" class="box" fill="#f0eaff" stroke="#a28bd1"/><text x="540" y="183" class="head" text-anchor="middle">FT-02 · Graph 오류</text><text x="415" y="225" class="body">동일 run_id 작업 재등록</text><text x="415" y="258" class="body">최초 포함 3회 · 대기 2→4→8초</text><text x="415" y="290" class="small">최신 시험: 결과 1건 저장</text>
<rect x="725" y="145" width="300" height="170" class="box" fill="#e7f5ed" stroke="#70ad88"/><text x="875" y="183" class="head" text-anchor="middle">FT-03 · DB 프로세스</text><text x="750" y="225" class="body">Docker Compose 재시작 정책</text><text x="750" y="258" class="body">DB 정상화 후 조회·추천 확인</text><text x="750" y="290" class="small">짧은 장애라 incident 미생성</text>
<rect x="1060" y="145" width="325" height="170" class="box" fill="#fff8e6" stroke="#d6b46a"/><text x="1222" y="183" class="head" text-anchor="middle">FT-04 · 구조화 출력</text><text x="1085" y="225" class="body">형식 수정 요청 1회</text><text x="1085" y="258" class="body">재검증 실패 시 안전 종료</text><text x="1085" y="290" class="small">최신 시험: 추천 SUCCESS</text>
</svg>
