name: Backend CI

on:
  push:
    branches:
      - main
      - "ci/discord-alert-test"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Test FastAPI backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    outputs:
      install_result: ${{ steps.backend_install.outcome }}
      test_result: ${{ steps.backend_test.outcome }}
      health_result: ${{ steps.backend_health.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        id: backend_install
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        id: backend_test
        run: python -m pytest -q

      - name: Start FastAPI and check health endpoint
        id: backend_health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/health; then
              echo "FastAPI started and /health returned HTTP 200"
              exit 0
            fi
            sleep 1
          done

          cat uvicorn.log
          echo "FastAPI did not start within 20 seconds"
          exit 1

  discord_notify:
    name: Notify Backend result on Discord
    needs:
      - backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Backend CI result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BACKEND_ID: ${{ vars.DISCORD_BACKEND_ID }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_INSTALL_RESULT: ${{ needs.backend.outputs.install_result }}
          BACKEND_TEST_RESULT: ${{ needs.backend.outputs.test_result }}
          BACKEND_HEALTH_RESULT: ${{ needs.backend.outputs.health_result }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not configured")
              raise SystemExit(1)

          webhook_parts = urlsplit(webhook_url)
          webhook_path_is_valid = re.fullmatch(
              r"/api/(?:v[0-9]+/)?webhooks/[0-9]{17,20}/[A-Za-z0-9._-]+",
              webhook_parts.path,
          )
          if (
              webhook_parts.scheme != "https"
              or webhook_parts.hostname not in {"discord.com", "discordapp.com"}
              or not webhook_path_is_valid
          ):
              print("DISCORD_WEBHOOK_URL 형식 확인 필요")
              raise SystemExit(1)
          print("Discord webhook URL 형식: 유효")

          lines = []
          mentioned_users = []
          result = os.environ.get("BACKEND_RESULT", "unknown")

          if result != "success":
              install_result = os.environ.get("BACKEND_INSTALL_RESULT", "")
              test_result = os.environ.get("BACKEND_TEST_RESULT", "")
              health_result = os.environ.get("BACKEND_HEALTH_RESULT", "")

              if test_result == "failure":
                  failed_stage = "pytest"
              elif health_result == "failure":
                  failed_stage = "FastAPI 실행 / Health Check"
              elif install_result == "failure":
                  failed_stage = "의존성 설치"
              else:
                  failed_stage = "Backend 검사"

              lines.extend([
                  "🚨 한강로컬패스 Backend CI 실패",
                  f"실패 단계 — {failed_stage}",
              ])
              backend_id = os.environ.get("DISCORD_BACKEND_ID", "").strip()
              if re.fullmatch(r"[0-9]{17,20}", backend_id):
                  lines.append(f"Backend 담당자 — <@{backend_id}>")
                  mentioned_users.append(backend_id)
                  print("Backend 담당자 멘션 설정: 사용")
              else:
                  lines.append("Backend 담당자 멘션 — DISCORD_BACKEND_ID 미설정 또는 형식 확인 필요")
                  print("Backend 담당자 멘션 설정: 미사용")
          else:
              lines = ["✅ 한강로컬패스 Backend CI 성공"]

          lines.extend([
              f"브랜치 — {os.environ.get('BRANCH_NAME', 'unknown')}",
              f"Commit — {os.environ.get('COMMIT_SHA', 'unknown')}",
              f"실행 로그 — {os.environ.get('RUN_URL', '')}",
          ])

          allowed_mentions = {"parse": []}
          if mentioned_users:
              allowed_mentions["users"] = mentioned_users

          payload = {
              "content": "\n".join(lines),
              "allowed_mentions": allowed_mentions,
          }
          request = Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "HanGangLocalPass-GitHubActions/1.0",
              },
              method="POST",
          )

          try:
              with urlopen(request, timeout=20) as response:
                  status_code = response.status
          except HTTPError as error:
              print(f"Discord webhook HTTP 응답: {error.code}")
              raise SystemExit(1)
          except (URLError, TimeoutError, OSError) as error:
              print(f"Discord webhook 요청 실패: {type(error).__name__}")
              raise SystemExit(1)

          print(f"Discord webhook HTTP 응답: {status_code}")
          if not 200 <= status_code < 300:
              raise SystemExit(1)
          PY
